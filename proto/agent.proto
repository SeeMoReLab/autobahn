syntax = "proto3";

option go_package = "github.com/tendermint/tendermint/proto/adaptive_timers;adaptivetimers";

import "google/protobuf/empty.proto";

enum Protocol {
    reserved 2;
    PROTOCOL_UNSPECIFIED = 0;
    PROTOCOL_PBFT = 1;
    PROTOCOL_SBFT = 3;
    PROTOCOL_TENDERMINT = 4;
    PROTOCOL_HOTSTUFF = 5;
    PROTOCOL_AUTOBAHN = 6;
    PROTOCOL_SMARTBFT = 7;
}

// Conventions shared by every *Report message below.
// - Units: latency, inter-commit gap and phase fields are float milliseconds.
//   Batch fields are float items per committed batch or block (requests,
//   except on Autobahn); throughput_tps is items per second.
// - Every consensus-latency, inter-commit-gap, batch-size and phase family
//   carries avg, p50, p90 and p95. Percentiles are nearest rank over the
//   window's samples: the ascending-sorted sample at index ceil(p*n)-1, and 0
//   with no samples. Below 20 samples p90 and p95 coincide.
// - Inter-commit gaps reset at every window: n commits in a window give n-1
//   gaps, so a window with 0 or 1 commits reports 0 for every gap statistic.
// - Phase families: the unprefixed phase field (e.g. prepare_latency_ms) is
//   the window mean; the p50_/p90_/p95_ prefixed fields are its percentiles.
//   Phase samples of 0 ms or more are kept, so a sub-millisecond phase counts.
// - Empty window: the engines report 0 when nothing committed; the learning
//   agent then sets all four consensus-latency statistics to the window
//   length. Gap, batch and phase statistics stay 0.
// - A field name means the same statistic in every message, but numbers are
//   per message. The statistics added for uniformity share one block from 30
//   up (39 is free); a message skips a number whose name it already carries
//   under an older number.
// - Same name, different measurement (documented, not unified):
//   - Consensus latency is one sample per batch, dated from the oldest request
//     in it, on CppBedrock (PBFT, SBFT); one sample per request, from its
//     arrival at this replica, on SmartBFT; one sample per height, from
//     round-0 enterPropose to commit, on Tendermint; one sample per block
//     (HotStuff) or header (Autobahn), from this replica's first sight of it.
//   - Tendermint excludes empty blocks from the batch statistics but counts
//     them in total_consensus_instances.
//   - Autobahn batch, total_transactions and throughput fields count
//     worker-batch digests, not requests.
//   - SBFT phases are not PBFT phases (see SbftReport).

// PBFT state report, shared by CppBedrock PBFT/LinearPBFT.
message PbftReport {
    // Workload size in the learning window.
    uint32 total_transactions = 1;
    uint32 total_consensus_instances = 2;

    // End-to-end PBFT consensus latency summaries (milliseconds).
    float avg_consensus_latency_ms = 3;
    float p50_consensus_latency_ms = 4;
    float p95_consensus_latency_ms = 5;

    // Throughput.
    float throughput_tps = 6;

    // Batch characteristics.
    float avg_batch_size = 7;
    float p95_batch_size = 8;

    // Leadership dynamics.
    uint32 leader_change_count = 9;
    uint32 regency_change_count = 10;

    // Timer and liveness context for the same learning window.
    uint32 timeout_ms = 11;
    float avg_inter_commit_gap_ms = 12;
    float p50_inter_commit_gap_ms = 13;
    float p95_inter_commit_gap_ms = 14;
    uint32 view_change_count = 15;
    uint32 no_progress_view_change_count = 16;

    // Phase-wise latency window means (milliseconds), reported by CppBedrock
    // PBFT: pre-prepare arrival -> prepare quorum, prepare quorum -> commit
    // quorum, commit quorum -> local execution.
    float pre_prepare_latency_ms = 17;
    float prepare_latency_ms = 18;
    float commit_latency_ms = 19;

    // Percentiles completing the avg/p50/p90/p95 families.
    float p90_consensus_latency_ms = 30;
    float p90_inter_commit_gap_ms = 34;
    float p50_batch_size = 36;
    float p90_batch_size = 37;
    float p50_pre_prepare_latency_ms = 40;
    float p90_pre_prepare_latency_ms = 41;
    float p95_pre_prepare_latency_ms = 42;
    float p50_prepare_latency_ms = 43;
    float p90_prepare_latency_ms = 44;
    float p95_prepare_latency_ms = 45;
    float p50_commit_latency_ms = 46;
    float p90_commit_latency_ms = 47;
    float p95_commit_latency_ms = 48;
}

// SBFT state report (CppBedrock SBFT). Fields 1-19 and 30-48 have the same
// layout as PbftReport so tooling can treat the two uniformly; fields 20-25
// carry the SBFT-specific fast/slow-path context.
message SbftReport {
    uint32 total_transactions = 1;
    uint32 total_consensus_instances = 2;
    float avg_consensus_latency_ms = 3;
    float p50_consensus_latency_ms = 4;
    float p95_consensus_latency_ms = 5;
    float throughput_tps = 6;
    float avg_batch_size = 7;
    float p95_batch_size = 8;
    uint32 leader_change_count = 9;
    uint32 regency_change_count = 10;
    // The election (view-change) timeout in force for this window.
    uint32 timeout_ms = 11;
    float avg_inter_commit_gap_ms = 12;
    float p50_inter_commit_gap_ms = 13;
    float p95_inter_commit_gap_ms = 14;
    uint32 view_change_count = 15;
    uint32 no_progress_view_change_count = 16;

    // Phase-wise latency window means (milliseconds). The names follow PBFT
    // but the phases differ: pre-prepare arrival -> certificate, certificate
    // -> execute certificate (about 0 on the fast path), and the rest to
    // local execution.
    float pre_prepare_latency_ms = 17;
    float prepare_latency_ms = 18;
    float commit_latency_ms = 19;

    // The slow-path (fast-path wait) timeout in force for this window.
    uint32 slow_path_timeout_ms = 20;
    // Consensus instances decided on the fast path versus the slow path in
    // this window. Zero for both until the engine attributes paths.
    uint32 fast_path_count = 21;
    uint32 slow_path_count = 22;
    // Measured only by the replica that led each sequence: over the sequences
    // it led in this window, the median time from the 2f+1-th to the n-th
    // prepare (the fast-path wait that would have caught it) among those whose
    // n-th prepare arrived by execution, and the counts with and without it.
    // Zero on a replica that led nothing.
    float nth_prepare_gap_ms = 23;
    uint32 nth_prepare_seen_count = 24;
    uint32 nth_prepare_unseen_count = 25;

    // Percentiles completing the avg/p50/p90/p95 families.
    float p90_consensus_latency_ms = 30;
    float p90_inter_commit_gap_ms = 34;
    float p50_batch_size = 36;
    float p90_batch_size = 37;
    float p50_pre_prepare_latency_ms = 40;
    float p90_pre_prepare_latency_ms = 41;
    float p95_pre_prepare_latency_ms = 42;
    float p50_prepare_latency_ms = 43;
    float p90_prepare_latency_ms = 44;
    float p95_prepare_latency_ms = 45;
    float p50_commit_latency_ms = 46;
    float p90_commit_latency_ms = 47;
    float p95_commit_latency_ms = 48;
}

message TendermintReport {
    // Workload size in the learning window.
    uint32 total_transactions = 1;
    uint32 total_consensus_instances = 2;

    // End-to-end Tendermint consensus latency summaries (milliseconds).
    float avg_consensus_latency_ms = 3;
    float p50_consensus_latency_ms = 4;
    float p90_consensus_latency_ms = 5;

    // Throughput and core rates.
    float throughput_tps = 6;
    float timeout_violation_rate = 7;

    // Batch characteristics.
    float avg_batch_size = 8;
    float p50_batch_size = 9;
    float p90_batch_size = 15;

    // Leadership dynamics.
    uint32 leader_change_count = 10;
    uint32 regency_change_count = 11;

    // Phase-wise latency window means (milliseconds), round 0 only except
    // that a height committing in a later round adds those rounds to
    // precommit: propose -> prevote, prevote -> precommit, precommit -> commit.
    float propose_latency_ms = 12;
    float prevote_latency_ms = 13;
    float precommit_latency_ms = 14;

    // Percentiles and the inter-commit gap family completing the
    // avg/p50/p90/p95 families.
    float p95_consensus_latency_ms = 31;
    float avg_inter_commit_gap_ms = 32;
    float p50_inter_commit_gap_ms = 33;
    float p90_inter_commit_gap_ms = 34;
    float p95_inter_commit_gap_ms = 35;
    float p95_batch_size = 38;
    float p50_propose_latency_ms = 40;
    float p90_propose_latency_ms = 41;
    float p95_propose_latency_ms = 42;
    float p50_prevote_latency_ms = 43;
    float p90_prevote_latency_ms = 44;
    float p95_prevote_latency_ms = 45;
    float p50_precommit_latency_ms = 46;
    float p90_precommit_latency_ms = 47;
    float p95_precommit_latency_ms = 48;

    // The propose timeout in force for this window. Tendermint has no
    // view-change counters: a round change is not an election.
    uint32 timeout_ms = 49;
}

// Batched (chained 2-chain) HotStuff state report. Field layout mirrors
// PbftReport so tooling can treat the two uniformly; semantic notes:
// - view_change_count counts local round timeouts fired.
// - no_progress_view_change_count counts timeouts fired with no commit since
//   the previous timeout.
// - regency_change_count counts observed round-number jumps beyond +1
//   between consecutive commits (i.e. rounds skipped via TCs).
// - leader_change_count follows the committed blocks' authors; HotStuff
//   rotates leaders every round, so this tracks commit cadence, not
//   elections.
// HotStuff has no phase fields.
message HotstuffReport {
    uint32 total_transactions = 1;
    uint32 total_consensus_instances = 2;
    float avg_consensus_latency_ms = 3;
    float p50_consensus_latency_ms = 4;
    float p95_consensus_latency_ms = 5;
    float throughput_tps = 6;
    float avg_batch_size = 7;
    float p95_batch_size = 8;
    uint32 leader_change_count = 9;
    uint32 regency_change_count = 10;
    uint32 timeout_ms = 11;
    float avg_inter_commit_gap_ms = 12;
    float p50_inter_commit_gap_ms = 13;
    float p95_inter_commit_gap_ms = 14;
    uint32 view_change_count = 15;
    uint32 no_progress_view_change_count = 16;

    // Percentiles completing the avg/p50/p90/p95 families.
    float p90_consensus_latency_ms = 30;
    float p90_inter_commit_gap_ms = 34;
    float p50_batch_size = 36;
    float p90_batch_size = 37;
}

// Autobahn state report. Same layout and semantics as HotstuffReport, with
// batch sizes measured in payload digests per committed header (transaction
// counts live in the worker processes, not the primary), and no
// regency_change_count: the engine does not surface a view per committed
// header, so it was always 0.
message AutobahnReport {
    uint32 total_transactions = 1;
    uint32 total_consensus_instances = 2;
    float avg_consensus_latency_ms = 3;
    float p50_consensus_latency_ms = 4;
    float p95_consensus_latency_ms = 5;
    float throughput_tps = 6;
    float avg_batch_size = 7;
    float p95_batch_size = 8;
    uint32 leader_change_count = 9;
    reserved 10;
    reserved "regency_change_count";
    uint32 timeout_ms = 11;
    float avg_inter_commit_gap_ms = 12;
    float p50_inter_commit_gap_ms = 13;
    float p95_inter_commit_gap_ms = 14;
    uint32 view_change_count = 15;
    uint32 no_progress_view_change_count = 16;

    // Percentiles completing the avg/p50/p90/p95 families.
    float p90_consensus_latency_ms = 30;
    float p90_inter_commit_gap_ms = 34;
    float p50_batch_size = 36;
    float p90_batch_size = 37;
}

// SmartBFT state report. Same layout and semantics as PbftReport. SmartBFT is
// registered as its own protocol so its reward function and schedule can be
// tuned independently of the Rust PBFT baseline. The engine leaves
// no_progress_view_change_count at 0.
message SmartbftReport {
    uint32 total_transactions = 1;
    uint32 total_consensus_instances = 2;
    float avg_consensus_latency_ms = 3;
    float p50_consensus_latency_ms = 4;
    float p95_consensus_latency_ms = 5;
    float throughput_tps = 6;
    float avg_batch_size = 7;
    float p95_batch_size = 8;
    uint32 leader_change_count = 9;
    uint32 regency_change_count = 10;
    uint32 timeout_ms = 11;
    float avg_inter_commit_gap_ms = 12;
    float p50_inter_commit_gap_ms = 13;
    float p95_inter_commit_gap_ms = 14;
    uint32 view_change_count = 15;
    uint32 no_progress_view_change_count = 16;

    // Held for phase fields with PbftReport's layout; SmartBFT exports no
    // phase stamps yet.
    reserved 17 to 19, 40 to 48;

    // Percentiles completing the avg/p50/p90/p95 families.
    float p90_consensus_latency_ms = 30;
    float p90_inter_commit_gap_ms = 34;
    float p50_batch_size = 36;
    float p90_batch_size = 37;
}

// One report from a local node for one episode.
message ReportLocal {
    reserved 11;
    uint32 node_id = 1;
    uint32 episode = 2;
    Protocol protocol = 3;
    // Window start consensus tick used to build this report.
    uint32 start_tick = 6;
    // Window end consensus tick (exclusive) used to build this report.
    uint32 report_seq = 7;
    // Number of locally delivered consensus instances in this window.
    // PBFT and SmartBFT use zero to identify a wall-clock-bounded window; the
    // actual delivered count remains in the report's total_consensus_instances.
    uint32 window_consensus_count = 8;
    oneof state {
        PbftReport pbft_state = 10;
        SbftReport sbft_state = 12;
        TendermintReport tendermint_state = 13;
        HotstuffReport hotstuff_state = 14;
        AutobahnReport autobahn_state = 15;
        SmartbftReport smartbft_state = 16;
    }
    // Message fields carry presence in proto3, so no `optional` is needed and the
    // gogo Go generator can consume this file.
    Reward reward = 4;
    bytes signature = 5;
}

// PBFT action/reward feedback.
message PbftReward {
    uint32 episode = 1;
    PbftReport report = 2;
    PbftTimeout timeout_used = 3;
}

// SBFT action/reward feedback.
message SbftReward {
    uint32 episode = 1;
    SbftReport report = 2;
    SbftTimeout timeout_used = 3;
}

// Tendermint action/reward feedback.
message TendermintReward {
    uint32 episode = 1;
    TendermintReport report = 2;
    TendermintTimeout timeout_used = 3;
}

// HotStuff action/reward feedback.
message HotstuffReward {
    uint32 episode = 1;
    HotstuffReport report = 2;
    HotstuffTimeout timeout_used = 3;
}

// Autobahn action/reward feedback.
message AutobahnReward {
    uint32 episode = 1;
    AutobahnReport report = 2;
    AutobahnTimeout timeout_used = 3;
}

// SmartBFT action/reward feedback.
message SmartbftReward {
    uint32 episode = 1;
    SmartbftReport report = 2;
    SmartbftTimeout timeout_used = 3;
}

// Reward for a prior episode, sent alongside the next report.
message Reward {
    reserved 2;
    oneof value {
        PbftReward pbft = 1;
        SbftReward sbft = 3;
        TendermintReward tendermint = 4;
        HotstuffReward hotstuff = 5;
        AutobahnReward autobahn = 6;
        SmartbftReward smartbft = 7;
    }
}

// Batch of signed reports submitted for consensus
message ReportBatch {
    uint32 episode = 1;
    Protocol protocol = 2;
    repeated ReportLocal reports = 3;
}

message PbftTimeout {
    uint32 election_timeout_milliseconds = 1;
}

// CppBedrock SBFT has no leader batching interval, so the timeout carries
// only the election and slow-path (fast-path wait) knobs.
message SbftTimeout {
    reserved 3;
    reserved "batch_timeout_milliseconds";
    uint32 election_timeout_milliseconds = 1;
    uint32 slow_path_timeout_milliseconds = 2;
}

message TendermintTimeout {
    uint32 propose_timeout_milliseconds = 1;
    uint32 prevote_timeout_milliseconds = 2;
    uint32 precommit_timeout_milliseconds = 3;
}

message HotstuffTimeout {
    uint32 timeout_delay_milliseconds = 1;
}

// Autobahn's only action is the view-change timeout; the fast-path wait is a
// fixed parameter (config/autobahn/parameters.json) and the engine has no car
// timeout.
message AutobahnTimeout {
    uint32 timeout_delay_milliseconds = 1;
    reserved 2, 3;
    reserved "car_timeout_milliseconds", "fast_path_timeout_milliseconds";
}

message SmartbftTimeout {
    uint32 election_timeout_milliseconds = 1;
}

// Timeout recommendation.
message Timeout {
    reserved 2;
    oneof value {
        PbftTimeout pbft = 1;
        SbftTimeout sbft = 3;
        TendermintTimeout tendermint = 4;
        HotstuffTimeout hotstuff = 5;
        AutobahnTimeout autobahn = 6;
        SmartbftTimeout smartbft = 7;
    }
}

// Request a timeout decision for a previously accepted report.
message TimeoutRequest {
    uint32 episode = 1;
    Protocol protocol = 2;
}

// Status wrapper for async timeout computation
message TimeoutStatus {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        NOT_RECEIVED = 1;
        PENDING = 2;
        READY = 3;
    }
    uint32 episode = 1;
    Status status = 2;
    Timeout timeout = 3;
    // Echoes the report window selected for this episode.
    uint32 start_tick = 4;
    uint32 report_seq = 5;
    uint32 window_consensus_count = 6;
}

// Consensus service
service Consensus {
    // Submit a batch of signed reports for consensus
    rpc SubmitReportBatch(ReportBatch) returns (google.protobuf.Empty);
}

// Learning agent service
service LearningAgent {
    // Send a report to the agent (status via gRPC error codes if rejected)
    rpc SendReport(ReportLocal) returns (google.protobuf.Empty);

    // Poll for timeout recommendation for a previously accepted report
    rpc GetTimeout(TimeoutRequest) returns (TimeoutStatus);

    // Share a report with other agents
    rpc ShareReport(ReportLocal) returns (google.protobuf.Empty);

    // Receive the final agreed reports from consensus
    rpc DeliverConsensus(ReportBatch) returns (google.protobuf.Empty);

    // Reset the agent's internal state/model
    rpc Reset(google.protobuf.Empty) returns (google.protobuf.Empty);
}
